[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingjingjing-brain"
version = "0.1.0"
description = "灵鲸鲸本地大脑：事件日志、记忆、状态与模型路由"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ling-brain = "lingbrain.__main__:main"

[tool.setuptools.packages.find]
where = ["apps/brain/src"]

[tool.pytest.ini_options]
pythonpath = ["apps/brain/src"]
testpaths = ["tests"]
addopts = "-q"
